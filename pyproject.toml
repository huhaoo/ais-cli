[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-cli"
version = "0.1.0"
description = "ais — switch provider profiles for OpenAI Codex CLI and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ais = "ais.cli:app"

[tool.setuptools.packages.find]
include = ["ais*"]
